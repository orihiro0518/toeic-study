<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC関係詞問題｜who・which・whose・whereの使い分け｜ORIVECTOR</title><meta name="description" content="関係詞は先行詞と、関係詞の後ろの文が完成しているかを確認します。人ならwho、物ならwhich、所有ならwhoseが基本です。"><link rel="canonical" href="https://orivector.jp/toeic-study/relative-clauses/"><meta name="robots" content="index,follow"><link rel="stylesheet" href="../seo-style.css"></head><body><main><a class="back" href="../">← TOEIC対策トップ</a><h1>TOEIC関係詞問題｜who・which・whose・whereの使い分け</h1><p>関係詞は先行詞と、関係詞の後ろの文が完成しているかを確認します。人ならwho、物ならwhich、所有ならwhoseが基本です。</p><h2>欠けている要素を見る</h2><div class="box">後ろの節に主語や目的語が欠けていれば関係代名詞が候補。whereやwhenの後ろは基本的に完全文になります。</div><h2>whoseの形</h2><div class="box">whose + 名詞の形で所有関係を表します。先行詞が人だけでなく物の場合にも使われます。</div><div class="tip">掲載問題・解説はORIVECTORオリジナルです。公式問題や市販教材の転載ではありません。</div><a class="cta" href="../">無料問題を解く →</a></main></body></html>
