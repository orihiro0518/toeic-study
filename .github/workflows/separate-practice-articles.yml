name: Separate TOEIC practice and articles
on:
  push:
    paths:
      - '.github/workflows/separate-practice-articles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<button class="card" onclick="showGrammarGuide()"><div class="icon">📘</div><h3>文法解説</h3><p>TOEIC頻出ルールを例文と見分け方で整理。</p></button>'''
          if old not in s and 'id="article-hub-card"' not in s:
              raise SystemExit('Expected grammar guide card not found; refusing broad rewrite')
          if old in s:
              s=s.replace(old,'',1)
          marker='''<div class="stats"><div class="stat"><b id="answeredCount">0</b><span>解答済み</span></div>'''
          article='''<div id="article-hub-card" class="card" style="margin-top:20px;border-color:#3b82f6"><div class="icon">📚</div><h2 style="margin:7px 0 6px">記事で学ぶ</h2><p>5文型・時制・助動詞・分詞・関係詞など、「なぜそうなる？」から理解する解説記事はこちら。</p><div class="btnrow"><a class="btn" href="articles/" style="text-decoration:none">TOEIC解説記事一覧へ →</a></div></div>\n'''
          if 'id="article-hub-card"' not in s:
              if marker not in s: raise SystemExit('Stats marker not found')
              s=s.replace(marker,article+marker,1)
          s=s.replace('頻出単語・熟語・文法を4択で反復し、間違えた問題だけ復習できます。文法は「なぜその答えになるか」まで基礎から解説します。','このページは問題演習専用です。頻出単語・熟語・文法を4択で反復し、間違えた問題だけ復習できます。文法をじっくり学びたい場合は「記事で学ぶ」へ。',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'id="article-hub-card"' index.html
          grep -q 'href="articles/"' index.html
          grep -q "startQuiz('vocab')" index.html
          grep -q "startQuiz('phrase')" index.html
          grep -q "startQuiz('grammar')" index.html
          if grep -q 'onclick="showGrammarGuide()"' index.html; then echo 'old mixed guide card remains' && exit 1; fi
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Separate TOEIC practice from learning articles'
          git push
