name: Apply TOEIC v1.1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-toeic-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="toeic-v2.js"></script>'
          if tag in s:
              print('already patched')
              raise SystemExit(0)
          marker='</body>'
          if marker not in s:
              raise SystemExit('body closing tag not found')
          s=s.replace(marker,tag+'\n'+marker,1)
          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          grep -q '<script src="toeic-v2.js"></script>' index.html
          test -s toeic-v2.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable TOEIC v1.1 learning experience'
          git push